<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <title>Nocturne</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Rojo butaca (--nc-nav): la barra del navegador en el celular. -->
    <meta name="theme-color" content="#6e1423" />
    <!-- Tema: se aplica antes del primer pintado, así el modo oscuro no
         parpadea en claro al cargar. Misma clave y valores que
         src/app/core/theme/theme.ts, que toma el control al arrancar la app. -->
    <script>
      (function () {
        var tema = 'light';
        try {
          tema = localStorage.getItem('nocturne_theme') || 'light';
        } catch (e) {}
        var oscuro =
          tema === 'dark' ||
          (tema === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        if (oscuro) {
          document.querySelector('meta[name="theme-color"]').content = '#451019';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
