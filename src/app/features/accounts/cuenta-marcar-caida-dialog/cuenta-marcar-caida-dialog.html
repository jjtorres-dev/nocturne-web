<h2 mat-dialog-title>Marcar como caída</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <p class="caida-info">
      <strong>{{ data.servicioNombre }}</strong> · {{ data.correo }}<br />
      Sus ventas se marcarán con «Cuenta caída» y no aparecerán para cobrar. Cuando el proveedor
      la reponga, usa «Reponer cuenta» para sumarles a tus clientes los días sin servicio.
    </p>

    <app-fecha-field
      formControlName="fechaCaida"
      label="Caída desde"
      hint="El día en que dejó de funcionar."
      requiredError="Elige desde qué día está caída."
      [max]="hoy"
      [errores]="{ futura: 'No puede ser una fecha futura.' }"
    />

    @if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Marcar como caída
      }
    </button>
  </mat-dialog-actions>
</form>
