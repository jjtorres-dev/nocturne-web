<h2 mat-dialog-title>{{ isEdit ? 'Editar perfil' : 'Nuevo perfil' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es obligatorio.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>PIN (opcional)</mat-label>
      <input
        matInput
        [type]="showPin() ? 'text' : 'password'"
        formControlName="pin"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="togglePin()"
        [attr.aria-label]="showPin() ? 'Ocultar PIN' : 'Mostrar PIN'"
      >
        <mat-icon>{{ showPin() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Guardar
      }
    </button>
  </mat-dialog-actions>
</form>
