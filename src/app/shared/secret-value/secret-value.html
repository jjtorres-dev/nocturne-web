@if (value()) {
  <span class="secret-value">
    <span class="secret-text">{{ revealed() ? value() : '••••••••' }}</span>
    <button mat-button type="button" (click)="toggle()">
      <mat-icon>{{ revealed() ? 'visibility_off' : 'visibility' }}</mat-icon>
      {{ revealed() ? 'Ocultar' : 'Mostrar' }}
    </button>
    <button mat-button type="button" (click)="copy()">
      <mat-icon>content_copy</mat-icon>
      Copiar
    </button>
  </span>
} @else {
  <span class="secret-text">—</span>
}
