@if (value()) {
  <span class="secret-value">
    <span class="secret-text">{{ visible() || revealed() ? value() : '••••••••' }}</span>
    <span class="secret-acciones">
      @if (!visible()) {
        <button mat-stroked-button type="button" [attr.aria-pressed]="revealed()" (click)="toggle()">
          <mat-icon>{{ revealed() ? 'visibility_off' : 'visibility' }}</mat-icon>
          {{ revealed() ? 'Ocultar' : 'Mostrar' }}
        </button>
      }
      <button mat-stroked-button type="button" (click)="copy()">
        <mat-icon>content_copy</mat-icon>
        Copiar
      </button>
    </span>
  </span>
} @else {
  <span class="secret-text secret-text--vacio">—</span>
}
