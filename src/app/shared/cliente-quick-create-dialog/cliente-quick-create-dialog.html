<h2 mat-dialog-title>Nuevo cliente</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es obligatorio.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>WhatsApp</mat-label>
      <input matInput formControlName="whatsapp" />
      <mat-hint>Con código de país, sin espacios. Ej.: +51987654321</mat-hint>
      @if (form.controls.whatsapp.hasError('required')) {
        <mat-error>El WhatsApp es obligatorio.</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Crear
      }
    </button>
  </mat-dialog-actions>
</form>
